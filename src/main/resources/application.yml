spring:
  application:
    name: kabal-document
  main:
    banner-mode: OFF
  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    url: ${NAIS_DATABASE_KABAL_DOCUMENT_PRIV_KABAL_DOCUMENT_JDBC_URL}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: flyway_history_schema,document
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-request-size: 1MB
      max-file-size: 1MB
  codec:
    max-in-memory-size: 512MB
  sql:
    init:
      platform: postgresql
  jpa:
    open-in-view: true

server:
  port: 7094
  error:
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  health:
    elasticsearch:
      enabled: false
  endpoint:
    health:
      show-details: never
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false

KABAL_FILE_API_BASE_URL: http://kabal-file-api
KABAL_FILE_API_APP_NAME: kabal-file-api

KLAGE_UNLEASH_PROXY_URL: http://klage-unleash-proxy

ORGANISASJONSNUMMER_TRYGDERETTEN: 974761084
